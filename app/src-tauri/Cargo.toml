[package]
name = "santral"
version = "0.0.1"
description = "Linux için karanlık çağ kontrol merkezi"
authors = ["santral kollektifi"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "santral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
which = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

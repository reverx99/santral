<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fitlinux — Preview</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <div id="app" class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">▮</span>
          <span class="brand-text">fitlinux</span>
          <span class="brand-tag" id="brand-tag">v0.0.1</span>
        </div>
        <nav class="nav">
          <button class="nav-item" data-route="sistem">
            <span class="nav-glyph">▤</span><span>Sistem</span>
          </button>
          <button class="nav-item" data-route="donanim">
            <span class="nav-glyph">⚙</span><span>Donanım</span>
          </button>
          <button class="nav-item" data-route="tarama">
            <span class="nav-glyph">▮</span><span>Tarama</span>
          </button>
          <button class="nav-item" data-route="paketler">
            <span class="nav-glyph">⊞</span><span>Paketler</span>
          </button>
          <button class="nav-item" data-route="uygulamalar">
            <span class="nav-glyph">▥</span><span>Uygulamalar</span>
          </button>
          <button class="nav-item" data-route="optimizasyon">
            <span class="nav-glyph">⚡</span><span>Optimizasyon</span>
          </button>
          <button class="nav-item" data-route="repolar">
            <span class="nav-glyph">≡</span><span>Repolar</span>
          </button>
          <button class="nav-item" data-route="suruculer">
            <span class="nav-glyph">◈</span><span>Sürücüler</span>
          </button>
          <button class="nav-item" data-route="ayarlar">
            <span class="nav-glyph">▣</span><span>Ayarlar</span>
          </button>
          <button class="nav-item" data-route="hakkinda">
            <span class="nav-glyph">∞</span><span>Hakkında</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <div class="status-line">
            <span class="dot dot-cyan"></span>
            <span id="status-text">preview · mock data</span>
          </div>
        </div>
      </aside>

      <main class="page" id="page"></main>
    </div>

    <script type="module" src="/src/preview.js"></script>
  </body>
</html>
